<!DOCTYPE html>
<html>
	<head>
		<title>Study Break</title>
		<!--Last Updated: 25 September 2026, 21:18-->
		
		<link rel="stylesheet" type="text/css" href="Focus.css">
		<!--script type="text/javascript" src="Focus.js"></script>-->
		
	</head>
	
	<body>
	<br>
	<hr>
		<h1>Welcome to Study Break</h1>
		<br>
		<p align="center">An app that makes studying easier by allocating a study/break cycle to optimize study sessions and avoid burnout.</p>
	
	<br>
	<hr>
	
	<h3>Study Timer</h3>
	
	<div id="container-1">
		<p id="hour-label" class="label">Hours</p>
		<p id="min-label" class="label">Minutes</p>
		<p id="sec-label" class="label">Seconds</p>
		<input id="hour" type="number" max="99" min="0" value="0" class="time"><p id="p1" class="semicolon">:</p>
		<input id="min" type="number" max="60" min="0" value="0" class="time"><p id="p2" class="semicolon">:</p>
		<input id="sec" type="number" max="60" min="0" value="0" class="time">
		<button id="start" class="btn">Start</button>
		<button id="pause" class="btn">Pause</button>
		<button id="reset" class="btn">Reset</button>
	</div>

	<script type="text/javascript" src="Focus.js"></script>
	</body>
</html>
